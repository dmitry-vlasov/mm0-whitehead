name = "whitehead-theory"
version = "0.1.0"
defaultTargets = ["Theory", "Spec", "Verifier"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[require]]
name = "mm0-whitehead"
path = ".."

[[lean_lib]]
name = "Theory"

[[lean_lib]]
name = "Spec"

[[lean_lib]]
name = "Verifier"

[[lean_exe]]
name = "ref-search"
root = "Main"

[[lean_exe]]
name = "diff-test"
root = "Diff"
