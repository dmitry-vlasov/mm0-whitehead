name = "mm0-whitehead"
version = "0.1.0"
defaultTargets = ["Whitehead", "Tests", "mm0-whitehead", "test", "mutate", "thorough"]
testDriver = "test"

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "Whitehead"

[[lean_lib]]
name = "Tests"
srcDir = "tests"

[[lean_exe]]
name = "mm0-whitehead"
root = "Main"

[[lean_exe]]
name = "test"
srcDir = "tests"
root = "Tests.Main"

[[lean_exe]]
name = "mutate"
srcDir = "tests"
root = "Tests.Mutate.Main"

[[lean_exe]]
name = "thorough"
srcDir = "tests"
root = "Tests.Thorough.Main"
